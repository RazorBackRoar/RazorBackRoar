name: Jules Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Squash-merge Jules PRs
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge Jules PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "CI did not succeed. Skipping."
              exit 0
            fi
            HEAD_BRANCH="$WORKFLOW_RUN_HEAD_BRANCH"
          else
            HEAD_BRANCH="$HEAD_REF"
          fi

          if [ -z "$HEAD_BRANCH" ] || [ "$HEAD_BRANCH" = "main" ] || [ "$HEAD_BRANCH" = "master" ]; then
            exit 0
          fi

          if [[ ! "$HEAD_BRANCH" =~ ^(sentinel-|bolt-|palette-) ]]; then
            echo "Branch $HEAD_BRANCH does not match allowed prefixes. Skipping."
            exit 0
          fi

          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number -q ".[0].number")
          
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            echo "Enabling auto-merge for PR #$pr_number on branch $HEAD_BRANCH..."
            gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --auto || \
            gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch || true
          fi

