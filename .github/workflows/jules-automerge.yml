name: Jules Auto-Merge

# Profile / docs-only repo variant (no CI workflow named "CI").
# Merges sentinel- / bolt- / palette- PRs from the owner and deletes the branch.
#
# Prefer pull_request (same-repo) over pull_request_target.
# Canonical copy: Apps/Docs/jules/workflows/jules-automerge-profile.yml

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.repository }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Squash-merge Jules PRs
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'RazorBackRoar' &&
      github.event.pull_request.draft == false &&
      (
        startsWith(github.head_ref, 'sentinel-') ||
        startsWith(github.head_ref, 'bolt-') ||
        startsWith(github.head_ref, 'palette-')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge Jules PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Merging Jules PR #${PR_NUMBER}..."
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --squash \
            --delete-branch \
            --auto \
            --match-head-commit "${HEAD_SHA}" \
          || gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --squash \
            --delete-branch \
            --match-head-commit "${HEAD_SHA}"
